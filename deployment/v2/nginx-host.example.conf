# Replace example.com and certificate paths. Do not expose :8080 to the public.
server {
    listen 80;
    server_name example.com;
    access_log off; # No visitor IP, URL or query string in routine logs.
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name example.com;
    access_log off; # No visitor IP, URL or query string in routine logs.
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Served by the host proxy while update.sh keeps the instance offline.
    error_page 503 =503 /v2-maintenance.html;
    location = /v2-maintenance.html {
        internal;
        alias /var/www/price-checker-v2-maintenance.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
    location = /v2-maintenance-state {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if (-f /run/price-checker-v2-prod-maintenance) {
            return 200 '{"maintenance":true}';
        }
        return 200 '{"maintenance":false}';
    }

    location / {
        if (-f /run/price-checker-v2-prod-maintenance) {
            return 503;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
