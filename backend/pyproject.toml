[project]
name = "price-checker-v2-backend"
version = "0.1.71"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.31.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "pyotp==2.10.0",
  "certifi==2026.10.23",
  "fastapi==0.138.0",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.49.0",
]
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
