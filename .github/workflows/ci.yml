name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: v2_test
          POSTGRES_USER: v2_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2_test -d v2_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest pytest-asyncio ruff
          python -m pip install -e backend --no-deps
      - name: Lint
        run: cd backend && python -m ruff check .
      - name: Prepare disposable database configuration
        run: |
          printf '%s\n' '{"provider":"postgres","project_url":"","host":"127.0.0.1","port":5432,"database":"v2_test","username":"v2_test","password":"ci-only-password","tls_mode":"disable"}' > "$RUNNER_TEMP/v2-test.json"
          chmod 600 "$RUNNER_TEMP/v2-test.json"
          echo "V2_AUTH_TEST_CONFIG=$RUNNER_TEMP/v2-test.json" >> "$GITHUB_ENV"
      - name: Test
        run: cd backend && python -m pytest -q tests

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n deployment/v2/install.sh deployment/v2/update.sh
      - name: Validate Compose configuration
        run: |
          mkdir -p "$RUNNER_TEMP/price-checker-v2/postgres"
          printf '%s' 'ci-only-password' > "$RUNNER_TEMP/price-checker-v2/postgres/password"
          PRICE_CHECKER_V2_DATA_DIR="$RUNNER_TEMP/price-checker-v2" docker compose -f deployment/v2/compose.yaml config --quiet
