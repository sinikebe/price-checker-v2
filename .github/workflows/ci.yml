name: Code checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: v2_test
          POSTGRES_USER: v2_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2_test -d v2_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest pytest-asyncio ruff==0.15.1
          python -m pip install -e backend --no-deps
      - name: Lint
        run: cd backend && python -m ruff check .
      - name: Prepare disposable database configuration
        run: |
          printf '%s\n' '{"provider":"postgres","project_url":"","host":"127.0.0.1","port":5432,"database":"v2_test","username":"v2_test","password":"ci-only-password","tls_mode":"disable"}' > "$RUNNER_TEMP/v2-test.json"
          chmod 600 "$RUNNER_TEMP/v2-test.json"
          echo "V2_AUTH_TEST_CONFIG=$RUNNER_TEMP/v2-test.json" >> "$GITHUB_ENV"
      - name: Test
        run: cd backend && python -m pytest -q tests

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:basket
      - run: npm run test:connector
      - run: npm run test:settings
      - run: npm run test:account
      - run: npm run test:nav
      - run: npm run test:bookmarklet
      - run: npm run build

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: |
          bash -n deployment/v2/install.sh deployment/v2/update.sh deployment/v2/install-scheduler.sh deployment/v2/configure-local-db.sh scripts/test_v2_update.sh scripts/test_v2_install.sh
          python3 -m py_compile deployment/v2/scheduled_update.py deployment/v2/prune_local_backups.py
      - name: Check component versions and path rules
        run: |
          python3 scripts/component_versions.py check
          python3 scripts/check_component_changelog.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Verify component version bumps and public notes
        env:
          V2_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags origin main
          verify_base="$(git merge-base HEAD origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$V2_PUSH_BEFORE" &&
                "$V2_PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$V2_PUSH_BEFORE^{commit}" 2>/dev/null; then
            verify_base="$V2_PUSH_BEFORE"
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            verify_base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/component_versions.py verify --base "$verify_base" --head HEAD
          python3 scripts/check_component_changelog.py --base "$verify_base"
      - name: Validate Compose configuration
        run: |
          mkdir -p "$RUNNER_TEMP/price-checker-v2/postgres"
          printf '%s' 'ci-only-password' > "$RUNNER_TEMP/price-checker-v2/postgres/password"
          PRICE_CHECKER_V2_DATA_DIR="$RUNNER_TEMP/price-checker-v2" docker compose -f deployment/v2/compose.yaml config --quiet


  upgrade:
    name: Installed V2 upgrade preserves data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # On push, test the entire pushed batch from the previously installed SHA.
      # On PR, this is empty and the test uses the prior dev revision.
      V2_UPGRADE_BASE_REF: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install prior revision, seed data and run guarded updater
        run: sudo env V2_UPGRADE_BASE_REF="$V2_UPGRADE_BASE_REF" bash scripts/test_v2_update.sh
      - name: Install current revision and bootstrap an administrator
        run: sudo bash scripts/test_v2_install.sh
